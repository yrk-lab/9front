name: Sync git4e to legacy contrib

on:
  push:
    branches:
      - git4e
  pull_request:
    branches:
      - git4e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-git4e-contrib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout git4e branch
        uses: actions/checkout@v4
        with:
          ref: git4e
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            bzip2 \
            curl \
            rsync

      - name: Restore 9legacy cache
        id: cache-9legacy
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/9legacy-base
            /tmp/9legacy.iso
          key: 9legacy-qemu-base-${{ runner.os }}-894c7b3b8ade4b500862c45cc53be23a610faa36

      - name: Build cached 9legacy base image
        if: steps.cache-9legacy.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          rm -rf /tmp/9legacy-base /tmp/9legacy-build
          git clone --depth 1 --branch main https://github.com/0intro/9legacy.git /tmp/9legacy-build
          cd /tmp/9legacy-build
          git checkout 894c7b3b8ade4b500862c45cc53be23a610faa36

          ./boot/mkdirs

          curl -fsSL http://9legacy.org/download/9legacy.iso.bz2 | bunzip2 > /tmp/9legacy.iso
          sudo mkdir -p /mnt/9legacy-iso
          sudo mount -o loop /tmp/9legacy.iso /mnt/9legacy-iso

          cp -a /mnt/9legacy-iso/386/bin/* 386/bin
          cp -a /mnt/9legacy-iso/386/9* /mnt/9legacy-iso/386/init /mnt/9legacy-iso/386/mbr /mnt/9legacy-iso/386/pbs* 386
          cp -a /mnt/9legacy-iso/amd64/bin/* amd64/bin
          cp -a /mnt/9legacy-iso/amd64/9* /mnt/9legacy-iso/amd64/init amd64
          cp -a /mnt/9legacy-iso/acme/bin/386/* acme/bin/386
          cp -a /mnt/9legacy-iso/acme/bin/amd64/* acme/bin/amd64

          sudo umount /mnt/9legacy-iso

          make -C sys/src/cmd/unix/u9fs

          rm -rf .git
          mv /tmp/9legacy-build /tmp/9legacy-base

      - name: Save 9legacy cache
        if: steps.cache-9legacy.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/9legacy-base
            /tmp/9legacy.iso
          key: 9legacy-qemu-base-${{ runner.os }}-894c7b3b8ade4b500862c45cc53be23a610faa36

      - name: Prepare runtime 9legacy tree
        run: |
          set -euo pipefail

          rm -rf /tmp/9legacy-run
          cp -a /tmp/9legacy-base /tmp/9legacy-run

          mkdir -p /tmp/9legacy-run/github/9front
          rsync -a --delete "$GITHUB_WORKSPACE/" /tmp/9legacy-run/github/9front/

          cat > /tmp/9legacy-run/rc/bin/termrc.local <<'EORC'
          #!/bin/rc
          rfork e

          statusfile=/usr/glenda/sync-git4e-contrib.status
          echo started > $statusfile

          if(! test -e /env/SOURCES_SECRET){
          	echo 'missing SOURCES_SECRET kernel parameter' >[1=2]
          	echo failed:nosecret > $statusfile
          	reboot
          	exit nosecret
          }

          # Ensure the IP stack is configured and the connection server is
          # DNS and the connection server are running so that 9fs can resolve
          # hostnames (e.g. sources.9p.io).
          # termrc.local is sourced before the main termrc sets these up.
          if(! test -e /net/ipifc/0/ctl)
          	ip/ipconfig
          if(! test -e /net/dns)
          	ndb/dns -r
          if(! test -e /srv/cs && ! test -e /net/cs)
          	ndb/cs -f /lib/ndb/local

          cd /github/9front
          .github/scripts/sync-git4e-contrib.rc /github/9front
          if(~ $status '')
          	echo ok > $statusfile
          if not
          	echo failed:sync > $statusfile

          reboot
          EORC
          chmod +x /tmp/9legacy-run/rc/bin/termrc.local

      - name: Boot 9legacy in QEMU
        env:
          SOURCES_SECRET: ${{ secrets.SOURCES_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCES_SECRET:-}" ]; then
            echo "SOURCES_SECRET is not configured" >&2
            exit 1
          fi

          # Write a minimal plan9.ini for the QEMU PXE client.
          # No menu, single 32-bit bootfile, nobootprompt — fully unattended.
          cat > /tmp/9legacy-run/cfg/pxe/525400123456 <<'EOPXE'
          bootfile=ether0!/386/9pc
          fs=10.0.2.1
          auth=10.0.2.1
          rootdir=/tmp/9legacy-run
          sysname=gnot
          *nobiosload=1
          partition=new
          factotumopts=-n
          user=glenda
          console=0
          mouseport=ps2intellimouse
          monitor=vesa
          vgasize=text
          *nomp=1
          nobootprompt=tcp
          EOPXE
          echo "PXE config at /tmp/9legacy-run/cfg/pxe/525400123456 (before SOURCES_SECRET):"
          cat /tmp/9legacy-run/cfg/pxe/525400123456
          printf 'SOURCES_SECRET=%s\n' "$SOURCES_SECRET" \
            >> /tmp/9legacy-run/cfg/pxe/525400123456

          cd /tmp/9legacy-run/boot
          if ! timeout --signal=TERM 45m qemu-system-x86_64 -m 1G -smp 1 -serial stdio -no-reboot \
            -drive file=pxeboot.raw,format=raw -snapshot \
            -device virtio-net-pci,netdev=net0,mac=52:54:00:12:34:56 \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.1:564-cmd:../sys/src/cmd/unix/u9fs/u9fs -a none -u $USER,tftp=.."; then
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "QEMU run timed out after 45 minutes" >&2
            fi
            exit "$status"
          fi

      - name: Validate sync result
        run: |
          set -euo pipefail
          test -f /tmp/9legacy-run/usr/glenda/sync-git4e-contrib.status
          grep -qx 'ok' /tmp/9legacy-run/usr/glenda/sync-git4e-contrib.status

      - name: Remove runtime tree
        if: always()
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/9legacy-run
